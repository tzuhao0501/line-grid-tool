<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LINE 六格套圖套標</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EAED; --panel:#FFFFFF; --ink:#1F1A17; --muted:#646A72; --line:#D3D6DB;
  --accent:#FF7500; --accent-ink:#3A1405; --accent-soft:#FFF0E3; --bad:#D4231B; --bad-soft:#FDE9E7; --ok:#1E7A46; --ok-soft:#E5F4EC;
  --field:#F6F7F8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181B; --panel:#212429; --ink:#ECEDEF; --muted:#A0A6AE; --line:#363A41;
    --accent-soft:#3A2412; --bad:#FF6B61; --bad-soft:#3A1A18; --ok:#5BD08F; --ok-soft:#173326; --field:#2A2E34;
  }
}
:root[data-theme="dark"]{
  --bg:#16181B; --panel:#212429; --ink:#ECEDEF; --muted:#A0A6AE; --line:#363A41;
  --accent-soft:#3A2412; --bad:#FF6B61; --bad-soft:#3A1A18; --ok:#5BD08F; --ok-soft:#173326; --field:#2A2E34;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:19px;font-weight:900;letter-spacing:.02em}
.mode{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--field);color:var(--muted);margin-right:auto;white-space:nowrap}
.mode.cloud{background:var(--ok-soft);color:var(--ok)}
.mode.local{background:var(--accent-soft);color:var(--accent-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mode.local{color:#FFB37A}}
:root[data-theme="dark"] .mode.local{color:#FFB37A}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;font-weight:500;line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;padding:9px 20px}
.btn.primary:disabled{background:var(--line);border-color:var(--line);color:var(--muted);opacity:1}
.btn.small{padding:5px 10px;font-size:13px}
.btn.warn{color:var(--bad);border-color:var(--bad)}
.dirty{font-size:12px;color:var(--muted);white-space:nowrap}
.dirty.on{color:var(--accent-ink);font-weight:700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dirty.on{color:#FFB37A}}
:root[data-theme="dark"] .dirty.on{color:#FFB37A}

main{display:grid;grid-template-columns:minmax(300px,520px) 1fr;gap:20px;padding:20px;max-width:1500px;margin:0 auto}
.left{position:sticky;top:12px;align-self:start;display:flex;flex-direction:column;gap:12px}
.stage{background:var(--panel);border-radius:12px;padding:10px;border:1px solid var(--line)}
#stage{outline:none;display:block;width:100%;height:auto;max-height:calc(100vh - 260px);object-fit:contain;touch-action:none;border-radius:4px;background:#ddd}
.tip{margin:0;font-size:13px;color:var(--muted)}
.tip b{color:var(--ink);font-weight:700}

.status{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14px}
.status ul{margin:6px 0 0;padding-left:1.2em}
.status li.bad{color:var(--bad)}
.status li.warn{color:var(--muted)}
.status .okline{color:var(--ok);font-weight:700}
.result{margin-top:8px;font-size:13px;color:var(--muted)}
.tplrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-content:start}
.card{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px}
.card.sel{border-color:var(--accent)}
.card header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3{margin:0;font-size:16px;font-weight:900}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:700}

.pics{display:grid;gap:8px}
.pics.n1{grid-template-columns:1fr}
.pics.n2,.pics.n3{grid-template-columns:repeat(2,1fr)}
.pics.n3 .pic:first-child{grid-row:span 2}
.pic{position:relative;border:1.5px dashed var(--line);border-radius:8px;min-height:96px;background:var(--field) center/cover no-repeat;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;outline-offset:2px}
.pic.has{border-style:solid}
.pic.cur{border-color:var(--accent);border-width:2.5px;border-style:solid}
.pic.over{border-color:var(--accent);background-color:var(--accent-soft)}
.pic .hint{padding:8px 8px 0;font-size:13px;color:var(--muted);text-align:center;line-height:1.4}
.pic.cur:not(.has) .hint{color:var(--accent-ink);font-weight:700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pic.cur:not(.has) .hint{color:#FFB37A}}
:root[data-theme="dark"] .pic.cur:not(.has) .hint{color:#FFB37A}
.pic.has .hint{display:none}
.pic .acts{display:flex;gap:6px;justify-content:center;padding:6px}
.pic .acts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 9px;font-size:12px}
.pic.has .acts{justify-content:flex-end}
.pic.has .acts button{background:rgba(0,0,0,.55);border-color:transparent;color:#fff}
.pic .ctrl{position:relative;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.55);color:#fff;padding:4px 6px;border-radius:0 0 6px 6px;font-size:12px}
.pic .ctrl input{flex:1;min-width:0;accent-color:var(--accent)}
.pic .del{border:0;background:transparent;color:#fff;font-size:13px;padding:0 2px}
.orig{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);background:var(--accent-soft);border-radius:8px;padding:6px 10px}
.orig a{font-weight:700;color:var(--accent-ink);text-decoration:underline}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .orig a{color:#FFB37A}}
:root[data-theme="dark"] .orig a{color:#FFB37A}
dialog#imp{border:0;border-radius:14px;padding:0;width:min(760px,calc(100vw - 32px));max-height:calc(100vh - 48px);background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog#imp::backdrop{background:rgba(20,20,24,.45)}
.imp-body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px}
.imp-body p{margin:0;font-size:14px;color:var(--muted)}
.imp-body code{font-size:13px;background:var(--field);border-radius:4px;padding:1px 5px;color:var(--ink)}
#impText{width:100%;min-height:190px;border:1.5px solid var(--line);background:var(--field);border-radius:8px;padding:10px;font:14px/1.6 ui-monospace,Menlo,Consolas,"Noto Sans TC",monospace;color:var(--ink);resize:vertical}
#impPrev{font-size:13px;color:var(--muted);margin:0;padding-left:1.2em}
#impPrev li.bad{color:var(--bad)}
.imp-acts{display:flex;gap:8px;justify-content:flex-end}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.field .cnt{font-variant-numeric:tabular-nums}
.field .cnt.bad{color:var(--bad);font-weight:700}
.field input{width:100%;border:1.5px solid var(--line);background:var(--field);border-radius:8px;padding:8px 10px;font-size:16px}
.field input.bad{border-color:var(--bad);background:var(--bad-soft)}
.field.title input{font-weight:700}

/* 作品紀錄 */
dialog#hist{border:0;border-radius:14px;padding:0;width:min(980px,calc(100vw - 32px));max-height:calc(100vh - 48px);background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog#hist::backdrop{background:rgba(20,20,24,.45)}
.hhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.hhead h2{margin:0 auto 0 0;font-size:18px;font-weight:900}
.tabs{display:flex;gap:6px;padding:12px 18px 0}
.tabs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 14px;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink);font-weight:700}
.hnote{margin:10px 18px 0;font-size:13px;color:var(--muted)}
.hsearch{margin:10px 18px 0;width:calc(100% - 36px);border:1.5px solid var(--line);background:var(--field);border-radius:8px;padding:8px 10px;font-size:15px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;padding:14px 18px 20px}
.work{border:1.5px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;background:var(--field)}
.work.cur{border-color:var(--accent);border-width:2.5px}
.work img{display:block;width:100%;aspect-ratio:1040/1470;object-fit:cover;background:#ddd}
.work .meta{padding:8px 10px 4px;font-size:13px;line-height:1.45}
.work .meta strong{display:block;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.work .meta span{color:var(--muted)}
.work .wacts{display:flex;gap:6px;padding:6px 10px 10px;flex-wrap:wrap}
.work .wacts .btn{flex:1;padding:5px 6px;font-size:13px}
.empty{padding:30px 18px 36px;color:var(--muted);text-align:center}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:10px;font-size:14px;max-width:min(92vw,560px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:1100px){.cards{grid-template-columns:1fr}}
@media (max-width:760px){
  .top{padding:12px 16px}
  main{grid-template-columns:1fr;padding:12px 16px}
  .left{position:static}
  #stage{max-height:none}
  .cards{grid-template-columns:1fr}
  .hgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <h1>LINE 六格套圖套標</h1>
  <span class="mode" id="mode">連線中…</span>
  <span class="dirty" id="dirty" aria-live="polite"></span>
  <button class="btn" id="btnImp">批次匯入</button>
  <button class="btn" id="btnHist">作品紀錄</button>
  <button class="btn" id="btnSave" title="Ctrl+S">儲存</button>
  <button class="btn" id="btnNew">開新的一張</button>
  <button class="btn primary" id="btnExport">匯出 PNG</button>
  <input type="file" id="fileTpl" accept="image/*" class="sr" tabindex="-1">
  <input type="file" id="filePic" accept="image/*" class="sr" tabindex="-1">
  <input type="file" id="fileProj" accept=".json,application/json" class="sr" tabindex="-1">
</header>

<main>
  <div class="left">
    <div class="stage"><canvas id="stage" width="1040" height="1470" tabindex="0" aria-label="成品預覽，點選格子後按 Ctrl+V 貼上圖片"></canvas></div>
    <p class="tip">點一下格子選取，網頁上的圖片按右鍵「複製圖片」後按 <b>Ctrl+V</b> 就會貼進選取的格子。在預覽圖上<b>拖曳</b>調整位置、<b>滾輪</b>縮放。</p>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="tplrow">範本：<button class="btn small" id="btnTpl">換範本底圖</button><button class="btn small" id="btnTplReset">還原預設範本</button></div>
  </div>
  <div class="cards" id="cards"></div>
</main>

<dialog id="imp" aria-labelledby="impTitle">
  <div class="hhead"><h2 id="impTitle">批次匯入標題與主圖</h2><button class="btn small" id="btnImpClose">取消</button></div>
  <div class="imp-body">
    <p>一行一格，依序填入第 1～6 格。格式：<code>主標｜副標｜主圖網址</code>，主圖網址可以留空。直接貼上 Claude 整理好的那段文字即可。</p>
    <textarea id="impText" spellcheck="false" placeholder="漢來五星水餃｜萬家福開賣現省10元｜https://...jpg"></textarea>
    <ul id="impPrev"></ul>
    <p>匯入會開一張新的；目前畫面上的內容會先存到作品紀錄。</p>
    <div class="imp-acts"><button class="btn primary" id="btnImpGo" disabled>匯入</button></div>
  </div>
</dialog>

<dialog id="hist" aria-labelledby="histTitle">
  <div class="hhead">
    <h2 id="histTitle">作品紀錄</h2>
    <button class="btn small" id="btnProjDown">下載目前這張的專案檔</button>
    <button class="btn small" id="btnProjOpen">開啓專案檔</button>
    <button class="btn small" id="btnHistClose">關閉</button>
  </div>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" id="tabCloud" data-t="cloud" aria-selected="true">全組共用</button>
    <button role="tab" id="tabLocal" data-t="local" aria-selected="false">這台電腦</button>
  </div>
  <p class="hnote" id="histNote"></p>
  <input class="hsearch" id="histSearch" type="search" placeholder="搜尋標題" aria-label="搜尋標題">
  <div class="hgrid" id="histGrid"></div>
</dialog>

<script>
(()=>{
const LIMIT_T=8, LIMIT_S=10, MAX_BYTES=1000000, MAX_SIDE=1800, LOCAL_KEEP=30;
const $=s=>document.querySelector(s);
const canvas=$('#stage'), ctx=canvas.getContext('2d');
let tplImg=null, tplSrc=DEFAULT_TEMPLATE, customTpl=false, cells=[];
let slots=[]; let sel={slot:0,sub:0}; let pickTarget=null; let drag=null;
let dirty=false, curWork=null;   // curWork: {id, where:'cloud'|'local', createdAt, by}
const imgCache=new Map();
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const newSlot=()=>({layout:1,title:'',sub:'',imgUrl:'',pics:[null,null,null]});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const stamp=(t=new Date())=>`${t.getFullYear()}${pad(t.getMonth()+1)}${pad(t.getDate())}_${pad(t.getHours())}${pad(t.getMinutes())}`;
const when=ms=>{const t=new Date(ms),n=new Date();const same=t.toDateString()===n.toDateString();return (same?'今天 ':`${t.getMonth()+1}/${t.getDate()} `)+`${pad(t.getHours())}:${pad(t.getMinutes())}`;};
const kb=n=>(n/1024).toFixed(0)+' KB';

/* ---------- toast ---------- */
let toastT; function toast(msg,ms=3200){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms);}

/* ---------- 字數：中文等全形字算 1，英數半形算 0.5 ---------- */
function countChars(s){let n=0;for(const ch of s){const c=ch.codePointAt(0);n+=(c<=0x7E||(c>=0xFF61&&c<=0xFFDC))?0.5:1;}return n;}
const fmtN=n=>Number.isInteger(n)?String(n):n.toFixed(1);

/* ---------- 本機儲存 (IndexedDB) ---------- */
const DB={db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open('line-grid-tool',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false);}catch(e){res(false)}})},
  get(k){return new Promise(res=>{try{const q=this.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined);}catch(e){res(undefined)}})},
  set(k,v){return new Promise(res=>{try{if(!this.db)return res(false);const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=tx.onabort=()=>res(false);}catch(e){res(false)}})},
  del(k){try{this.db&&this.db.transaction('kv','readwrite').objectStore('kv').delete(k);}catch(e){}}
};
const snapSlots=()=>slots.map(s=>({layout:s.layout,title:s.title,sub:s.sub,imgUrl:s.imgUrl||'',pics:s.pics.map(p=>p?{src:p.src,zoom:p.zoom,ox:p.ox,oy:p.oy}:null)}));
let saveT; function persist(){clearTimeout(saveT);saveT=setTimeout(()=>{DB.set('state',{slots:snapSlots(),dirty,curWork});},400);}
function changed(){dirty=true;updDirty();persist();}
function hasContent(){return slots.some(s=>s.title.trim()||s.sub.trim()||s.pics.some(Boolean));}
function updDirty(){const d=$('#dirty');
  if(!hasContent()){d.textContent='';d.className='dirty';return;}
  d.textContent=dirty?'● 尚未儲存':'✓ 已儲存';d.className='dirty'+(dirty?' on':'');}

/* ---------- 圖片 ---------- */
function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('load'));i.src=src;});}
function getImg(src){let i=imgCache.get(src);if(!i){i=new Image();i.onload=()=>draw();i.src=src;imgCache.set(src,i);}return i;}
/* 把圖片縮到合理大小並轉成 JPEG（不使用 blob: 網址，Claude 連結版也能用） */
function toJpeg(source,w,h){
  const s=Math.min(1,MAX_SIDE/Math.max(w,h));
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*s));c.height=Math.max(1,Math.round(h*s));
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.imageSmoothingQuality='high';x.drawImage(source,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.9);
}
const readAsDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});
async function fileToSrc(file){
  if(typeof createImageBitmap==='function'){
    try{const bmp=await createImageBitmap(file);try{return toJpeg(bmp,bmp.width,bmp.height);}finally{bmp.close&&bmp.close();}}catch(e){}
  }
  const img=await loadImage(await readAsDataURL(file));
  return toJpeg(img,img.naturalWidth,img.naturalHeight);
}
const safeUrl=u=>typeof u==='string'&&/^https?:\/\/\S+$/i.test(u.trim())?u.trim():'';
const waitingSlot=from=>{for(let n=1;n<=slots.length;n++){const i=(from+n)%slots.length;if(slots[i].imgUrl&&!slots[i].pics[0])return i;}return -1;};
function setPic(src,slot,sub){slots[slot].pics[sub]={src,zoom:1,ox:0,oy:0};getImg(src);sel={slot,sub};
  const next=waitingSlot(slot);let msg='';
  if(sub===0&&slots[slot].imgUrl&&next>=0){sel={slot:next,sub:0};msg=`，接著貼第 ${next+1} 格`;}
  renderCards();draw();changed();
  if(msg)document.querySelectorAll('#cards .card')[sel.slot]?.scrollIntoView({block:'nearest',behavior:'smooth'});
  return msg;}
let lastPutMsg='';
async function putPic(file,slot,sub){
  if(!file||!/^image\//.test(file.type)){toast('這不是圖片檔');return false;}
  try{lastPutMsg=setPic(await fileToSrc(file),slot,sub)||'';return true;}
  catch(e){toast('這張圖片讀不到，請換一張，或先存到電腦再用「選檔案」');return false;}
}
/* 用網址抓圖：先直接下載，不行再用圖片方式載入（需要對方主機允許跨網站讀取） */
function loadCors(url){return new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.referrerPolicy='no-referrer';
  const t=setTimeout(()=>rej(new Error('timeout')),15000);i.onload=()=>{clearTimeout(t);res(i);};i.onerror=()=>{clearTimeout(t);rej(new Error('load'));};i.src=url;});}
async function urlToSrc(url){
  try{const r=await fetch(url,{mode:'cors',referrerPolicy:'no-referrer'});if(r.ok){const b=await r.blob();if(/^image\//.test(b.type))return await fileToSrc(b);}}catch(e){}
  const img=await loadCors(url);
  return toJpeg(img,img.naturalWidth,img.naturalHeight);   // 對方不允許時這裡會被瀏覽器擋下
}
async function tryFetchImage(url,slot,sub,quiet){

  catch(e){if(!quiet)toast('這個網站不允許直接抓圖。請在圖片上按右鍵「複製圖片」，再回來按 Ctrl+V。',5500);return false;}

const imgUrlFromHtml=html=>{const m=/<img[^>]+src=["']([^"']+)["']/i.exec(html||'');return m&&/^https?:/i.test(m[1])?m[1]:null;};

/* ---------- 範本偵測 ---------- */
function detect(img){
  const W=img.naturalWidth,H=img.naturalHeight;
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0);
  const d=x.getImageData(0,0,W,H).data, N=W*H, white=new Uint8Array(N);
  for(let i=0,p=0;i<N;i++,p+=4)white[i]=(d[p]>=225&&d[p+1]>=225&&d[p+2]>=225)?1:0;
  const lab=new Uint8Array(N), stack=new Int32Array(N), comps=[];
  for(let i=0;i<N;i++){
    if(!white[i]||lab[i])continue;
    let sp=0;stack[sp++]=i;lab[i]=1;let minx=W,maxx=0,miny=H,maxy=0,area=0;
    while(sp){const k=stack[--sp],kx=k%W,ky=(k-kx)/W;area++;
      if(kx<minx)minx=kx;if(kx>maxx)maxx=kx;if(ky<miny)miny=ky;if(ky>maxy)maxy=ky;
      if(kx>0&&white[k-1]&&!lab[k-1]){lab[k-1]=1;stack[sp++]=k-1;}
      if(kx<W-1&&white[k+1]&&!lab[k+1]){lab[k+1]=1;stack[sp++]=k+1;}
      if(ky>0&&white[k-W]&&!lab[k-W]){lab[k-W]=1;stack[sp++]=k-W;}
      if(ky<H-1&&white[k+W]&&!lab[k+W]){lab[k+W]=1;stack[sp++]=k+W;}
    }
    const bw=maxx-minx+1,bh=maxy-miny+1;
    if(bw>=150&&bh>=150&&area>0.6*bw*bh)comps.push({x:minx,y:miny,w:bw,h:bh});
  }
  const isW=(px,py)=>white[py*W+px]===1;
  const px=(X,Y)=>{const p=(Y*W+X)*4;return [d[p],d[p+1],d[p+2]];};
  const out=[];
  for(const cb of comps){
    const cx=Math.round(cb.x+cb.w/2), yEnd=cb.y+cb.h; let top=-1,bot=-1,y=cb.y+10;
    while(y<yEnd){if(isW(cx,y)){y++;continue;}let y2=y;while(y2<yEnd&&!isW(cx,y2))y2++;if(y2-y>=20){top=y;bot=y2;break;}y=y2;}
    if(top<0)continue;
    const mid=Math.round((top+bot)/2);let l=cx,r=cx;
    while(l>cb.x&&!isW(l-1,mid))l--; while(r<cb.x+cb.w-1&&!isW(r+1,mid))r++;
    const f=px(cx,mid);let dark=[255,255,255],dl=999,sw=0,started=false;
    for(let yy=top;yy<top+10;yy++){const q=px(cx,yy),lum=q[0]*.3+q[1]*.59+q[2]*.11;if(lum<dl){dl=lum;dark=q;}
      if(lum<90){sw++;started=true;}else if(started)break;}
    sw+=0.5;
    out.push({
      box:cb,
      photo:{x:cb.x+8,y:cb.y+8,w:cb.w-16,h:mid-(cb.y+8)},
      pill:{x:l,y:top,w:r-l+1,h:bot-top,fill:`rgb(${f})`,stroke:`rgb(${dark})`,sw:clamp(sw,1,4)},
      sub:{cx:cb.x+cb.w/2,cy:(bot+cb.y+cb.h)/2,maxW:cb.w-12,h:cb.y+cb.h-bot}
    });
  }
  out.sort((a,b)=>Math.abs(a.box.y-b.box.y)>40?a.box.y-b.box.y:a.box.x-b.box.x);
  return out;
}
async function applyTemplate(src,isCustom){
  const img=await loadImage(src);const found=detect(img);
  if(!found.length)throw new Error('nocell');
  tplImg=img;tplSrc=src;customTpl=isCustom;cells=found;
  canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;
  while(slots.length<cells.length)slots.push(newSlot());
  if(slots.length>cells.length)slots.length=cells.length;
  sel.slot=clamp(sel.slot,0,cells.length-1);

/* ---------- 繪製 ---------- */
function subRects(c,layout){

  const hh=(r.h-g)/2;return[L,{x:R.x,y:r.y,w:hw,h:hh},{x:R.x,y:r.y+hh+g,w:hw,h:hh}];
}
function fitPic(pic,r,img){

}
function pillPath(x,p){const i=p.sw/2,X=p.x+i,Y=p.y+i,w=p.w-p.sw,h=p.h-p.sw,r=h/2;

const FONT='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
function fit(x,text,weight,base,maxW){let s=base;x.font=`${weight} ${s}px ${FONT}`;const w=x.measureText(text).width;if(w>maxW){s=Math.max(14,Math.floor(base*maxW/w));x.font=`${weight} ${s}px ${FONT}`;}return s;}
function render(x,forExport){
  const W=x.canvas.width,H=x.canvas.height;
  x.clearRect(0,0,W,H);if(!tplImg)return;
  x.drawImage(tplImg,0,0);x.imageSmoothingQuality='high';
  cells.forEach((c,i)=>{
    const s=slots[i];if(!s)return;
    x.fillStyle='#fff';x.fillRect(c.photo.x,c.photo.y,c.photo.w,c.photo.h);
    subRects(c,s.layout).forEach((r,k)=>{
      const pic=s.pics[k],isSel=sel.slot===i&&sel.sub===k;
      if(pic){const img=getImg(pic.src);
        if(img.complete&&img.naturalWidth){const{dw,dh}=fitPic(pic,r,img);
          x.save();x.beginPath();x.rect(r.x,r.y,r.w,r.h);x.clip();

      }else if(!forExport){

        const msg=isSel?(k===0&&s.imgUrl?'點「開啟原圖」複製後按 Ctrl+V':'按 Ctrl+V 貼上圖片'):(k===0&&s.imgUrl?'待貼主圖':'點一下選取這格');

        x.fillText(msg,r.x+r.w/2,r.y+Math.min(r.h/2,(c.pill.y-r.y)/2));

      if(!forExport&&isSel){x.save();x.strokeStyle='#FF7500';x.lineWidth=6;x.setLineDash([16,10]);x.strokeRect(r.x+3,r.y+3,r.w-6,r.h-6);x.restore();}
    });
    const p=c.pill;pillPath(x,p);x.fillStyle=p.fill;x.fill();x.lineWidth=p.sw;x.strokeStyle=p.stroke;x.stroke();
    x.textAlign='center';x.textBaseline='middle';
    if(s.title){const fs=fit(x,s.title,900,Math.round(p.h*0.56),p.w-p.h*0.6);const ty=p.y+p.h/2+fs*0.04;

      x.fillStyle='#fff';x.fillText(s.title,p.x+p.w/2,ty);}
    if(s.sub){const fs=fit(x,s.sub,500,Math.round(c.sub.h*0.76),c.sub.maxW);
      x.fillStyle='#1A1A1A';x.fillText(s.sub,c.sub.cx,c.sub.cy+fs*0.04);}
  });
}

/* ---------- PNG 編碼（壓到 1MB 內）---------- */

  const keys=[];for(let k=0;k<32768;k++)if(bins[k])keys.push(k);

  const mk=arr=>{let mn=[31,31,31],mx=[0,0,0],cnt=0;for(const k of arr){cnt+=bins[k];for(let c=0;c<3;c++){const v=ch[c](k);if(v<mn[c])mn[c]=v;if(v>mx[c])mx[c]=v;}}
    let ax=0,rg=-1;for(let c=0;c<3;c++)if(mx[c]-mn[c]>rg){rg=mx[c]-mn[c];ax=c;}return{keys:arr,cnt,ax,rg};};
  const boxes=[mk(keys)];
  while(boxes.length<K){let bi=-1,bs=0;boxes.forEach((b,i)=>{if(b.keys.length<2||b.rg===0)return;const sc=b.cnt*b.rg;if(sc>bs){bs=sc;bi=i;}});
    if(bi<0)break;const b=boxes[bi],f=ch[b.ax];b.keys.sort((u,v)=>f(u)-f(v));
    let acc=0,cut=1;for(let i=0;i<b.keys.length;i++){acc+=bins[b.keys[i]];if(acc>=b.cnt/2){cut=i+1;break;}}
    cut=clamp(cut,1,b.keys.length-1);boxes.splice(bi,1,mk(b.keys.slice(0,cut)),mk(b.keys.slice(cut)));}
  const pal=boxes.map(b=>{let r=0,g=0,bl=0,n=0;for(const k of b.keys){r+=sr[k];g+=sg[k];bl+=sb[k];n+=bins[k];}return[Math.round(r/n),Math.round(g/n),Math.round(bl/n)];});
  const look=new Uint8Array(32768);
  for(const k of keys){const r=sr[k]/bins[k],g=sg[k]/bins[k],b=sb[k]/bins[k];let best=0,bd=1e18;
    for(let i=0;i<pal.length;i++){const dr=r-pal[i][0],dg=g-pal[i][1],db=b-pal[i][2],dd=dr*dr*3+dg*dg*4+db*db*2;if(dd<bd){bd=dd;best=i;}}look[k]=best;}
  const idx=new Uint8Array(d.length/4);
  for(let p=0,i=0;p<d.length;p+=4,i++)idx[i]=look[((d[p]>>3)<<10)|((d[p+1]>>3)<<5)|(d[p+2]>>3)];

}
async function encodeIndexed(w,h,pal,idx){
  const raw=new Uint8Array((w+1)*h);for(let y=0;y<h;y++){raw[y*(w+1)]=0;raw.set(idx.subarray(y*w,(y+1)*w),y*(w+1)+1);}

  const pl=new Uint8Array(pal.length*3);pal.forEach((c,i)=>pl.set(c,i*3));
  return new Blob([new Uint8Array([137,80,78,71,13,10,26,10]),chunk('IHDR',ih),chunk('PLTE',pl),chunk('IDAT',await zlib(raw)),chunk('IEND',new Uint8Array(0))],{type:'image/png'});
}

async function doExport(){
  const{bad}=issues();if(bad.length){toast('字數超過上限，無法匯出');return;}

    let blob=await new Promise(r=>c.toBlob(r,'image/png')),note='無損';
    if(!blob||blob.size>MAX_BYTES){
      if(typeof CompressionStream==='undefined')throw new Error('nocs');
      const d=x.getImageData(0,0,c.width,c.height).data;
      for(const K of [256,192,128,96,64]){const{pal,idx}=quantize(d,K);blob=await encodeIndexed(c.width,c.height,pal,idx);note=`壓縮為 ${pal.length} 色`;if(blob.size<=MAX_BYTES)break;}

    lastResult=`<br>最近一次匯出：${kb(blob.size)}（${note}）`;refreshStatus();

}

async function saveWork({full,quiet}={}){
  if(!hasContent()){if(!quiet)toast('目前這張是空的，不用儲存');return false;}
  if(saving)return saving;
  saving=(async()=>{
    const btn=$('#btnSave');btn.disabled=true;
    try{
      const c=full||await renderFull();const thumb=await makeThumb(c);const p=buildProject();
      const where=target();
      const reuse=curWork&&curWork.where===where?curWork:null;
      if(where==='cloud') await cloudSave(p,thumb,reuse);
      else await localSave(p,thumb,reuse);
      dirty=false;updDirty();persist();
      if(!quiet)toast(where==='cloud'?'已存到作品紀錄（全組共用）':'已存到作品紀錄（這台電腦）');

/* ---------- 批次匯入 ---------- */
function parseImport(text){
  const rows=[];
  for(let line of text.split(/\r?\n/)){
    line=line.trim();if(!line||/^[-=*#]+$/.test(line))continue;
    let parts=line.split(/\s*[|｜\t]\s*/).map(x=>x.trim()).filter((x,j,a)=>!(j===0&&x===''&&a.length>1));
    if(parts[parts.length-1]==='')parts.pop();
    if(parts.length&&/^(第?\s*\d+\s*格?|\d+[.、])$/.test(parts[0]))parts.shift();      // 開頭的「1」「第1格」編號
    if(parts.length&&/^主標$/.test(parts[0]))continue;                                     // 表頭
    if(!parts.length)continue;
    const url=parts.find(x=>/^https?:\/\//i.test(x))||'';
    const txt=parts.filter(x=>!/^https?:\/\//i.test(x)&&!/^(圖|主圖|\[圖\]\(.*\))$/.test(x));
    rows.push({title:txt[0]||'',sub:txt[1]||'',url:safeUrl(url)});
  }
  return rows;
}

}

  for(const i of want){if(await tryFetchImage(slots[i].imgUrl,i,0,true))ok++;}
  const first=waitingSlot(-1);
  if(first>=0){sel={slot:first,sub:0};renderCards();draw();}
  toast(ok===want.length?`已匯入 ${rows.length} 格標題和 ${ok} 張主圖`
    :`標題已填好；${want.length-ok} 張主圖要手動貼：按該格的「開啟原圖」，複製圖片後回來按 Ctrl+V`,7000);
};

$('#btnHist').onclick=()=>{histTab=dbNS?'cloud':'local';$('#histSearch').value='';renderHist();$('#hist').showModal();};
$('#btnHistClose').onclick=()=>$('#hist').close();
$('#hist').addEventListener('click',e=>{if(e.target===$('#hist'))$('#hist').close();});
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{histTab=b.dataset.t;renderHist();});
$('#histSearch').oninput=renderHist;

/* ---------- 工具列 ---------- */
$('#btnExport').onclick=doExport;
$('#btnSave').onclick=()=>saveWork();
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveWork();}});
$('#btnNew').onclick=async()=>{
  if(!hasContent()){toast('目前就是空白的一張');return;}
  const wasDirty=dirty;
  if(!(await keepCurrent()))return;
  slots=cells.map(()=>newSlot());sel={slot:0,sub:0};lastResult='';curWork=null;dirty=false;
  renderCards();draw();persist();updDirty();
  toast(wasDirty?'上一張已存到作品紀錄，開始新的一張':'開始新的一張，上一張在作品紀錄裡');
};
$('#btnTpl').onclick=()=>{$('#fileTpl').value='';$('#fileTpl').click();};
$('#fileTpl').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  const src=await blobToDataURL(f);
  try{const n=await applyTemplate(src,true);DB.set('tpl',src);renderCards();draw();changed();toast(`已換上新範本，偵測到 ${n} 格`);}
  catch(err){toast('找不到放圖的白色格子和標題橘框，請確認底圖是空白範本');}
};
$('#btnTplReset').onclick=async()=>{try{await applyTemplate(DEFAULT_TEMPLATE,false);DB.del('tpl');renderCards();draw();changed();toast('已還原預設範本');}catch(e){}};

/* 關閉頁面前提醒 */
window.addEventListener('beforeunload',e=>{if(dirty&&hasContent()){e.preventDefault();e.returnValue='';return '';}});

/* ---------- 啓動 ---------- */
(async()=>{
  await DB.open();
  const savedTpl=DB.db?await DB.get('tpl'):null;
  const st=DB.db?await DB.get('state'):null;
  localList=(DB.db&&await DB.get('works'))||[];
  if(st&&Array.isArray(st.slots)){
    slots=st.slots.map(s=>({layout:s.layout||1,title:s.title||'',sub:s.sub||'',imgUrl:safeUrl(s.imgUrl),pics:[0,1,2].map(k=>s.pics&&s.pics[k]?{...s.pics[k]}:null)}));
    dirty=st.dirty===undefined?true:!!st.dirty;curWork=st.curWork||null;
  }
  try{await applyTemplate(savedTpl||DEFAULT_TEMPLATE,!!savedTpl);}catch(e){await applyTemplate(DEFAULT_TEMPLATE,false);}
  renderCards();draw();ensureFonts();updDirty();
  document.fonts&&document.fonts.ready.then(draw);

  // 連線判斷：在 Claude 裡開 → 全組共用；直接開 .html → 本機模式
  const C=window.claude;
  if(!C||typeof C.use!=='function'){modeLabel();return;}
  try{
    const [dl,db,as,us]=await Promise.all(['downloads','db','assets','user'].map(n=>C.use(n).catch(()=>null)));
    downloadsNS=dl;dbNS=db;assetsNS=as;userNS=us;
    if(userNS){try{myId=await userNS.id();}catch(e){}}
    let canWrite=null;if(userNS){try{canWrite=await userNS.can('data.write');}catch(e){}}
    cloudWritable=!!(dbNS&&assetsNS)&&canWrite!==false;
    if(curWork&&curWork.where==='cloud'&&!cloudWritable)curWork=null;
    if(dbNS)startCloud();
  }catch(e){}
  modeLabel();
})();
})();
</script>
</body>
</html>
